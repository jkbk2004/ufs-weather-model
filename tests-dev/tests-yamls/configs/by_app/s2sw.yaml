s2sw_intel:
  build:
    compiler: intel
    option: -DAPP=S2SW -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1
  tests:
  - cpld_control_noaero_p8:
      project:
      - daily
      baseline: 'True'
      resources:
        orion: {ppn: 40, nodes: 5, wlclk: 30}
        hera: {ppn: 40, nodes: 5, wlclk: 30}
        ursa: {ppn: 192, nodes: 2, wlclk: 30}
        derecho: {ppn: 128, nodes: 2, wlclk: 30}
        hercules: {ppn: 80, nodes: 3, wlclk: 30}
        gaeac6: {ppn: 192, nodes: 2, wlclk: 30}
  - cpld_control_nowave_noaero_p8:
      project:
      - daily
      baseline: 'True'
      turnoff:
      - noaacloud
      resources:
        orion: {ppn: 40, nodes: 5, wlclk: 30}
        hera: {ppn: 40, nodes: 5, wlclk: 30}
        ursa: {ppn: 192, nodes: 1, wlclk: 30}
        derecho: {ppn: 128, nodes: 2, wlclk: 30}
        hercules: {ppn: 80, nodes: 3, wlclk: 30}
        gaeac6: {ppn: 192, nodes: 1, wlclk: 30}
s2sw_debug_intel:
  build:
    compiler: intel
    option: -DAPP=S2SW -DDEBUG=ON -DCCPP_SUITES=FV3_GFS_v17_coupled_p8_ugwpv1
    turnoff:
    - wcoss2
    - noaacloud
    - acorn
  tests:
  - cpld_debug_noaero_p8:
      project:
      - daily
      baseline: 'True'
      turnoff:
      - wcoss2
      - acorn
      - noaacloud
      resources:
        orion: {ppn: 40, nodes: 5, wlclk: 30}
        hera: {ppn: 40, nodes: 5, wlclk: 30}
        ursa: {ppn: 192, nodes: 2, wlclk: 30}
        derecho: {ppn: 128, nodes: 2, wlclk: 30}
        hercules: {ppn: 80, nodes: 3, wlclk: 30}
        gaeac6: {ppn: 192, nodes: 2, wlclk: 30}
