atml_intel:
  build:
    compiler: intel
    option: -DAPP=ATML -DCCPP_SUITES=FV3_GFS_v16,FV3_GFS_v16_flake,FV3_GFS_v17_p8,FV3_GFS_v17_p8_rrtmgp,FV3_GFS_v15_thompson_mynn_lam3km,FV3_WoFS_v0,FV3_GFS_v17_p8_mynn,FV3_GFS_v17_p8_ugwpv1
      -D32BIT=ON
  tests:
  - control_p8_atmlnd:
      project:
      - daily
      baseline: 'True'
      turnoff:
      - noaacloud
      - wcoss2
      resources:
        orion: {ppn: '40', nodes: '8', wlclk: '00:30:00'}
        hera: {ppn: '40', nodes: '8', wlclk: '00:30:00'}
        ursa: {ppn: '192', nodes: '2', wlclk: '00:30:00'}
        derecho: {ppn: '128', nodes: '3', wlclk: '00:30:00'}
        hercules: {ppn: '80', nodes: '4', wlclk: '00:30:00'}
        gaeac6: {ppn: '192', nodes: '2', wlclk: '00:30:00'}
  - control_restart_p8_atmlnd:
      project:
      - daily
      dependency: control_p8_atmlnd
      turnoff:
      - noaacloud
      - wcoss2
      resources:
        orion: {ppn: '40', nodes: '8', wlclk: '00:30:00'}
        hera: {ppn: '40', nodes: '8', wlclk: '00:30:00'}
        ursa: {ppn: '192', nodes: '2', wlclk: '00:30:00'}
        derecho: {ppn: '128', nodes: '3', wlclk: '00:30:00'}
        hercules: {ppn: '80', nodes: '4', wlclk: '00:30:00'}
        gaeac6: {ppn: '192', nodes: '2', wlclk: '00:30:00'}
